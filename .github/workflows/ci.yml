name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  MAVEN_OPTS: -Xmx2g

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ecuacion-splib

      - uses: actions/checkout@v5
        with:
          repository: ecuacion-jp/ecuacion-lib
          path: ecuacion-lib

      - uses: actions/checkout@v5
        with:
          repository: ecuacion-jp/ecuacion-utils
          path: ecuacion-utils

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build ecuacion-lib
        working-directory: ecuacion-lib
        run: mvn install -DskipTests -q

      - name: Build ecuacion-utils
        working-directory: ecuacion-utils
        run: mvn install -DskipTests -q

      - name: Validate POM after version update
        working-directory: ecuacion-splib
        run: |
          # -DprocessAllModules=true on every goal below: ecuacion-splib-dependencies' <parent>
          # points outside the reactor (jp.ecuacion.lib:ecuacion-lib-dependencies), which breaks
          # these goals' default reactor-linked module discovery and leaves it (and every module
          # that in turn has it as <parent>) at the old version.
          #
          # versions:set and versions:set-property must run in the same mvn invocation:
          # versions:set bumps every module's own <version>, but the ecuacion-splib.version
          # property used for the self-referencing ecuacion-splib-parent BOM import in
          # ecuacion-splib-dependencies/pom.xml isn't a real <version>, so it's left stale.
          # A later, separate `mvn` call can't fix it either: parsing the now-inconsistent
          # POMs to start that call already fails before versions:set-property can run.
          mvn versions:set -DnewVersion=0.0.0-CI-TEST -DprocessAllModules=true -DgenerateBackupPoms=false versions:set-property -Dproperty=ecuacion-splib.version -DnewVersion=0.0.0-CI-TEST -DprocessAllModules=true -DgenerateBackupPoms=false
          mvn versions:update-properties -DprocessAllModules=true -Dincludes=jp.ecuacion.lib,jp.ecuacion.util,jp.ecuacion.internal-util,jp.ecuacion.splib -DgenerateBackupPoms=false
          mvn validate
          git checkout -- .

      - name: Verify
        working-directory: ecuacion-splib
        run: mvn verify -Dwagon.skip=true

      - name: Upload coverage to Codecov
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ecuacion-splib/ecuacion-splib-core/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-jpa/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-batch/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-web/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-web-jpa/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-rest/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
