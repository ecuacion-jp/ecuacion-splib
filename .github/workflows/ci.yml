name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  MAVEN_OPTS: -Xmx2g
  # Codecov only ingests coverage for main pushes and PRs targeting main; jacoco's
  # report generation is skipped everywhere else since nothing would consume it.
  UPLOAD_COVERAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: ecuacion-splib

      - uses: actions/checkout@v5
        with:
          repository: ecuacion-jp/ecuacion-lib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}
          path: ecuacion-lib

      - uses: actions/checkout@v5
        with:
          repository: ecuacion-jp/ecuacion-utils
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}
          path: ecuacion-utils

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Exclude build paths from Windows Defender scanning
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.m2"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Build ecuacion-lib
        working-directory: ecuacion-lib
        run: mvn install -Dmaven.test.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dallure.report.skip=true

      - name: Build ecuacion-utils
        working-directory: ecuacion-utils
        run: mvn install -Dmaven.test.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dallure.report.skip=true

      - name: Validate POM after version update
        if: matrix.os == 'ubuntu-latest'
        working-directory: ecuacion-splib
        run: |
          # -DprocessAllModules=true on every goal below: ecuacion-splib-dependencies' <parent>
          # points outside the reactor (jp.ecuacion.lib:ecuacion-lib-dependencies), which breaks
          # these goals' default reactor-linked module discovery and leaves it (and every module
          # that in turn has it as <parent>) at the old version.
          #
          # versions:set and versions:set-property must run in the same mvn invocation:
          # versions:set bumps every module's own <version>, but the ecuacion-splib.version
          # property used for the self-referencing ecuacion-splib-parent BOM import in
          # ecuacion-splib-dependencies/pom.xml isn't a real <version>, so it's left stale.
          # A later, separate `mvn` call can't fix it either: parsing the now-inconsistent
          # POMs to start that call already fails before versions:set-property can run.
          mvn versions:set -DnewVersion=0.0.0-CI-TEST -DprocessAllModules=true -DgenerateBackupPoms=false versions:set-property -Dproperty=ecuacion-splib.version -DnewVersion=0.0.0-CI-TEST -DprocessAllModules=true -DgenerateBackupPoms=false
          mvn versions:update-properties -DprocessAllModules=true -Dincludes=jp.ecuacion.lib,jp.ecuacion.util,jp.ecuacion.internal-util,jp.ecuacion.splib -DgenerateBackupPoms=false
          mvn validate
          git checkout -- .

      - name: Verify (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ecuacion-splib
        run: |
          if [ "$UPLOAD_COVERAGE" = "true" ]; then
            mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Dlicense.skip=true -e
          else
            mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Dlicense.skip=true -Djacoco.skip=true -e
          fi

      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        working-directory: ecuacion-splib
        run: mvn test -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -e

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.UPLOAD_COVERAGE == 'true'
        # Third-party action pinned to a commit SHA (tags are mutable): v5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ecuacion-splib/ecuacion-splib-core/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-jpa/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-batch/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-ui/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-web/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-web-jpa/target/site/jacoco/jacoco.xml,
            ecuacion-splib/ecuacion-splib-rest/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
