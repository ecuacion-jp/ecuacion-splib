<!--/*
	Login page for ecuacion-splib's own built-in admin pages (e.g. ConfigController).
	Posts to /ecuacion-splib/public/adminLogin/action, handled directly by Spring Security's
	loginProcessingUrl (see SplibBuiltinAdminSecurityConfig) — there is no matching controller
	method for the POST.

	The <form> here is hand-written rather than going through
	bootstrap/components-general-form :: generalForm, because that fragment always computes
	its th:action from loginState/function/subFunction, and this page's POST target is fixed
	by Spring Security's loginProcessingUrl instead. javaFormName is therefore set explicitly
	via th:with below (components-general-form normally supplies it) so that
	bootstrap/components-input fragments, which reference it, still resolve correctly.
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base}"
		th:with="title=#{jp.ecuacion.splib.web.builtinAdminLogin.title}, width='narrow'">

<body>
	<div layout:fragment="base-content">

		<th:block th:with="javaFormName='builtinAdminLoginForm'">
			<form th:object="${builtinAdminLoginForm.builtinAdminLogin}"
					th:action="@{/ecuacion-splib/public/adminLogin/action}" method="post">

				<div class="row">
					<div th:replace="~{bootstrap/components-input :: inputText('username', 'width=full,readonly')}"></div>
					<div th:replace="~{bootstrap/components-input :: inputPassword('password', 'width=full')}"></div>
				</div>
				<br>
				<div th:replace="~{bootstrap/components-input :: submitButton('builtinAdminLoginSubmit',
						#{jp.ecuacion.splib.web.builtinAdminLogin.submit}, 'classappend=w-100')}"></div>

			</form>
		</th:block>

	</div>
</body>
</html>
