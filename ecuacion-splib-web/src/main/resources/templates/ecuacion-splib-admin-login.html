<!--/*
	Login page for ecuacion-splib's own built-in admin pages (e.g. ConfigController).
	Posts to /ecuacion-splib/public/adminLogin/action, handled directly by Spring Security's
	loginProcessingUrl (see SplibBuiltinAdminSecurityConfig) — there is no matching controller
	method for the POST.
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-base}"
		th:with="title=#{jp.ecuacion.splib.web.builtinAdminLogin.title}, width='narrow'">

<body>
	<div layout:fragment="base-content">

		<form th:action="@{/ecuacion-splib/public/adminLogin/action}" method="post">

			<div class="mb-3">
				<label class="form-label" th:text="#{jp.ecuacion.splib.web.builtinAdminLogin.username}"></label>
				<input type="text" name="username" value="ecuacion-splib" class="form-control" readonly>
			</div>

			<div class="mb-3">
				<label class="form-label" for="builtinAdminLoginPassword" th:text="#{jp.ecuacion.splib.web.builtinAdminLogin.password}"></label>
				<input type="password" id="builtinAdminLoginPassword" name="password" class="form-control" autofocus>
			</div>

			<button type="submit" class="btn btn-primary w-100" th:text="#{jp.ecuacion.splib.web.builtinAdminLogin.submit}"></button>

		</form>

	</div>
</body>
</html>
