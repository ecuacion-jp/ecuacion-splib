<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{bootstrap/page-general-narrow}"
		th:with="title=#{jp.ecuacion.splib.web.adminLoginCode.title}">

<head>
	<meta charset="UTF-8"/>
</head>
<body>
	<div layout:fragment="form-content" th:remove="tag">
		<div th:replace="~{bootstrap/components :: paragraph('jp.ecuacion.splib.web.adminLoginCode.desc', '')}"></div>
		<div th:replace="~{bootstrap/components-input :: inputText('code', 'width=full')}"></div>
		<br>
		<div class="d-flex justify-content-center gap-3">
			<div th:replace="~{bootstrap/components-input :: submitButton('verify', 'jp.ecuacion.splib.web.adminLoginCode.button.verify', '')}"></div>
			<div th:replace="~{bootstrap/components-input :: submitButton('resend', 'jp.ecuacion.splib.web.adminLoginCode.button.resend', '')}"></div>
		</div>
	</div>

	<!--/* to give up (outside the form of the page) */-->
	<div layout:fragment="bottom-space" th:remove="tag">
		<form method="post" th:action="@{/public/adminLogout}" class="text-center mt-3">
			<div th:replace="~{bootstrap/components-input :: submitButton('logout', 'jp.ecuacion.splib.web.adminLoginCode.button.logout', '')}"></div>
		</form>
	</div>
</body>
</html>
